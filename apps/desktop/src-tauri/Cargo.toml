[package]
name = "discatelier-desktop"
version.workspace = true
edition.workspace = true
description = "Personal physical media collection"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
discatelier-domain.workspace = true
discatelier-netease-runtime.workspace = true
discatelier-agent-harness.workspace = true
discatelier-integration-http.workspace = true
discatelier-provider-netease.workspace = true
chrono.workspace = true
sha2.workspace = true
uuid.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
discatelier-application.workspace = true
discatelier-contracts.workspace = true
discatelier-storage.workspace = true
discatelier-provider-discogs.workspace = true
discatelier-optical-windows.workspace = true
discatelier-player-mpv.workspace = true
discatelier-player-vlc.workspace = true
keyring = { version = "=3.6.3", features = ["windows-native"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["native-tls", "system-proxy"] }
serde.workspace = true
base64 = "0.22.1"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
local-ip-address = "=0.6.13"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
semver = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "system-proxy", "gzip"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[features]
isolated-preview = []
performance-harness = ["discatelier-player-mpv/test-fixture"]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "=0.6.1"
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
