[workspace]
members = ["crates/netease-runtime", "crates/agent-harness", "crates/integration-http", "crates/provider-netease", "crates/domain", "crates/contracts", "crates/application", "crates/storage-sqlite", "crates/provider-discogs", "crates/optical-windows", "crates/player-mpv", "crates/player-vlc", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.21"
edition = "2021"
license = "LicenseRef-Private"

[workspace.dependencies]
discatelier-netease-runtime = { path = "crates/netease-runtime" }
discatelier-agent-harness = { path = "crates/agent-harness" }
discatelier-integration-http = { path = "crates/integration-http" }
discatelier-provider-netease = { path = "crates/provider-netease" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
discatelier-domain = { path = "crates/domain" }
discatelier-contracts = { path = "crates/contracts" }
discatelier-application = { path = "crates/application" }
discatelier-storage = { path = "crates/storage-sqlite" }
discatelier-provider-discogs = { path = "crates/provider-discogs" }
discatelier-optical-windows = { path = "crates/optical-windows" }
discatelier-player-mpv = { path = "crates/player-mpv" }
discatelier-player-vlc = { path = "crates/player-vlc" }

# Model packages contain many embedded images. Keep validation practical in the
# debug desktop too; application code retains normal debug assertions and symbols.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 2
