<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DiscAtelier</title>
  <link rel="stylesheet" href="./shell.css">
  <link rel="stylesheet" href="./store.css">
  <link rel="stylesheet" href="./inspection.css">
  <link rel="stylesheet" href="./controls.css">
</head>
<body data-direction="store">
  <div class="workspace">
    <header class="topbar">
      <a class="wordmark" href="./index.html" aria-label="DiscAtelier"><span class="disc-mark"></span>DiscAtelier<span class="wordmark-dot">.</span></a>
      <nav class="categories" aria-label="收藏分区">
        <button class="active" data-category="music">音乐</button>
        <button data-category="video">影像</button>
      </nav>
      <div class="top-actions">
        <div class="search-control">
          <button class="icon-button" id="search-toggle" aria-label="搜索收藏" data-tooltip="搜索" aria-expanded="false" aria-controls="search"><span data-icon="search"></span></button>
          <input id="search" type="search" placeholder="搜索" aria-label="搜索关键词" hidden>
        </div>
        <button class="icon-button" id="add" aria-label="添加收藏" data-tooltip="添加"><span data-icon="plus"></span></button>
        <button class="icon-button" id="tools-toggle" popovertarget="tools-popover" aria-label="更多" data-tooltip="更多"><span data-icon="more"></span></button>
      </div>
    </header>
    <div id="tools-popover" popover>
      <label class="scope-field">范围<select id="status-filter" aria-label="收藏范围"><option value="all">全部</option><option value="wanted">想购入</option><option value="transit">在途</option></select></label>
      <button id="organize"><span data-icon="list"></span><span id="organize-label">整理</span></button>
      <button id="drive"><span data-icon="drive"></span>光驱</button>
      <button id="assistant"><span data-icon="spark"></span>助手</button>
      <div class="menu-totals"><span id="count">8 套</span><span id="amount">价格未填写</span></div>
      <p class="prototype-note">原型 · 数据仅本次有效 · <a href="../assets/fonts/LICENSE.pdf" target="_blank" rel="noopener">MiSans</a></p>
    </div>
    <main id="scene" aria-label="收藏展示"></main>
  </div>
  <dialog id="inspection" aria-label="收藏详情">
    <button class="return-button" id="put-back"><span data-icon="back"></span>放回</button>
    <div class="inspection-layout">
      <div class="object-stage"><div id="inspection-cover"></div><div class="object-floor"></div><button id="rotate" class="rotate-button"><span data-icon="rotate"></span>侧面</button></div>
      <section class="object-info">
        <h1 id="object-title"></h1><p id="object-creator"></p>
        <nav class="detail-tabs" aria-label="详情内容"><button class="active" data-detail-tab="metadata">资料</button><button data-detail-tab="purchase">购入</button></nav>
        <div id="metadata-tab"><dl id="metadata"></dl></div>
        <form id="purchase-tab" hidden novalidate>
          <div class="form-row"><label>价格<input name="amount" inputmode="decimal" placeholder="未填写"></label><label>币种<select name="currency"><option>CNY</option><option>HKD</option><option>JPY</option></select></label></div>
          <label>购入位置<input name="seller" maxlength="200" placeholder="未填写"></label>
          <label>收藏状态<select name="status"><option value="owned">已购入</option><option value="wanted">想购入</option><option value="transit">在途</option></select></label>
          <label>购买链接<input name="purchaseUrl" type="url" placeholder="https://"></label>
          <p id="purchase-error" role="alert"></p><button type="submit" class="solid-button">保存</button>
        </form>
        <div class="object-actions"><button id="want"><span data-icon="heart"></span><span id="want-label">想购入</span></button><span id="object-status"></span></div>
      </section>
    </div>
  </dialog>
  <dialog id="add-dialog" class="panel-dialog">
    <form id="add-form" novalidate>
      <div class="panel-heading"><h2>添加收藏</h2><button type="button" class="icon-button" data-close aria-label="关闭"><span data-icon="close"></span></button></div>
      <label>名称<input name="title" maxlength="200" required autocomplete="off"></label>
      <label>作者<input name="creator" maxlength="200" autocomplete="off"></label>
      <div class="form-row"><label>分区<select name="category"><option value="music">音乐</option><option value="video">影像</option></select></label><label>状态<select name="status"><option value="owned">已购入</option><option value="wanted">想购入</option><option value="transit">在途</option></select></label></div>
      <div class="form-row"><label>价格<input name="amount" inputmode="decimal" placeholder="未填写"></label><label>币种<select name="currency"><option>CNY</option><option>HKD</option><option>JPY</option></select></label></div>
      <label>购入位置<input name="seller" maxlength="200"></label>
      <p class="form-note">手动演示；Discogs 条码 / 品番检索尚未接入。</p>
      <p id="add-error" role="alert"></p><button class="solid-button" type="submit">加入收藏</button>
    </form>
  </dialog>
  <dialog id="utility-dialog" class="panel-dialog"><div class="panel-heading"><h2 id="utility-title"></h2><button class="icon-button" data-close aria-label="关闭"><span data-icon="close"></span></button></div><div id="utility-body"></div></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
