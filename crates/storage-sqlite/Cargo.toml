[package]
name = "discatelier-storage"
version.workspace = true
edition.workspace = true

[dependencies]
discatelier-domain.workspace = true
discatelier-contracts.workspace = true
discatelier-application.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde_json.workspace = true
serde.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2.workspace = true
base64 = "0.22"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
openskp = { git = "https://github.com/hew3d/openskp", rev = "a6788afa6386cfd4bc781998dca99c591b3fb069" }
earcutr = "=0.5.0"
zip = { version = "=4.6.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Globalization"] }

[dev-dependencies]
tempfile = "3"
